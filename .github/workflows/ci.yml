name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: gofmt check
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: staticcheck
        run: make staticcheck

      - name: go test -race ./...
        run: make test-race
